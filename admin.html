<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出欠管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* メンバー画面と同じ約束で作る。色は意味にだけ使う。 */
:root{
  --bg:#F1F2F4; --card:#FFFFFF; --ink:#151A21; --ink-2:#59636F; --ink-3:#8C96A2; --line:#E3E6EA;
  --go:#12783F; --go-soft:#E4F1E9;
  --stop:#BE3B2F; --stop-soft:#FBEAE7;
  --match:#16233A; --match-on:#FFFFFF;
  --wait:#B08422; --wait-soft:#FAF1DC;
  --shadow:0 1px 2px rgba(21,26,33,.05), 0 8px 20px rgba(21,26,33,.06);
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --num:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1216; --card:#171C22; --ink:#E8ECF0; --ink-2:#9AA5B1; --ink-3:#6E7883; --line:#242B33;
    --go:#41B270; --go-soft:#12291C; --stop:#E4695C; --stop-soft:#2E1815;
    --match:#2B3A56; --match-on:#EDF2FA; --wait:#D8B45C; --wait-soft:#2B2313;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--jp);line-height:1.6;
  -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%}
textarea{line-height:1.7}
:focus-visible{outline:3px solid var(--go);outline-offset:2px;border-radius:8px}
[hidden]{display:none !important}

.wrap{max-width:680px;margin:0 auto;padding:14px 14px 56px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  padding:4px 2px 12px;border-bottom:2px solid var(--ink)}
.title{font-size:20px;font-weight:900;margin:0;letter-spacing:.01em}
.title span{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.16em;
  margin-left:9px;vertical-align:3px}

.tabs{display:flex;gap:6px;margin:14px 0 18px}
.tabs button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink-2);
  border-radius:10px;padding:11px 4px;font-size:14px;font-weight:700;letter-spacing:.06em}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.sect{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.16em;margin:24px 2px 8px}
.card{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.card .pad{padding:14px}

.grid{display:grid;gap:10px}
.grid.two{grid-template-columns:1fr 1fr}
label.f{display:block;font-size:11px;font-weight:700;color:var(--ink-3);
  margin-bottom:5px;letter-spacing:.1em}

.btn{border:none;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:700;
  background:var(--ink);color:var(--bg);letter-spacing:.06em}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.btn.danger{background:transparent;border:1px solid var(--stop);color:var(--stop)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 予定：メンバー画面と同じ帯 */
.band{display:flex;align-items:baseline;gap:9px;padding:11px 14px 9px;flex-wrap:wrap}
.kind-match .band{background:var(--match);color:var(--match-on)}
.kind-practice .band{border-bottom:1px solid var(--line)}
.d-num{font-family:var(--num);font-size:27px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.d-dow{font-size:13px;font-weight:700;margin-left:-3px}
.d-dow.sun{color:#E4695C}
.d-dow.sat{color:#7FB2E8}
.kind-practice .d-dow.sun{color:var(--stop)}
.kind-practice .d-dow.sat{color:#2F7BC4}
.badge{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.1em;padding:3px 9px;
  border-radius:999px;align-self:center}
.kind-match .badge{background:rgba(255,255,255,.16);color:var(--match-on)}
.kind-practice .badge{background:var(--bg);color:var(--ink-2)}
.meta{font-size:13.5px;color:var(--ink-2);margin:0 0 8px}
.meta .t{font-family:var(--num);font-size:17px;font-weight:700;margin-right:7px;color:var(--ink);
  font-variant-numeric:tabular-nums}

.tally{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);
  font-weight:700;letter-spacing:.04em}
.tally b{font-family:var(--num);font-size:19px;font-weight:700;color:var(--ink-2);margin-left:3px;
  font-variant-numeric:tabular-nums}
.tally .yes b{color:var(--go)}
.tally .no b{color:var(--stop)}

.nore{background:var(--wait-soft);color:var(--wait);border-radius:9px;padding:10px 12px;
  font-size:13px;margin-top:10px;line-height:1.75}
.nore b{font-weight:700}

/* 代理入力 */
.proxy{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.pname{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname i{font-family:var(--num);font-style:normal;font-size:14px;font-weight:700;
  color:var(--ink-3);margin-right:7px}
.pset{display:flex;gap:5px;flex:0 0 auto}
.pset button{border:1px solid var(--line);background:transparent;color:var(--ink-3);
  border-radius:7px;padding:6px 12px;font-size:13px;font-weight:700}
.pset button[aria-pressed="true"].yes{background:var(--go);border-color:var(--go);color:#fff}
.pset button[aria-pressed="true"].no{background:var(--stop);border-color:var(--stop);color:#fff}

/* メンバー */
.mrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mrow:last-child{border-bottom:none}
.mrow.off{opacity:.5}
.mrow .no{width:66px;flex:0 0 auto;text-align:center;font-family:var(--num);font-weight:700}
.mrow .nm{flex:1;min-width:110px}

.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:999px;
  white-space:nowrap}
.tag.on{background:var(--go-soft);color:var(--go)}
.tag.off{background:var(--bg);color:var(--ink-3);border:1px solid var(--line)}
.mrow .em{flex:1 1 100%;min-width:0;font-size:13px}
.pset button.car[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pset button:disabled{opacity:.35;cursor:default}
.code{font-family:var(--num);font-size:44px;font-weight:700;letter-spacing:.22em;
  text-align:center;color:var(--ink);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.codebox{background:var(--bg);border-radius:12px;padding:14px}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:var(--ink-2)}
.chk input{width:20px;height:20px;flex:0 0 auto}

/* リンク */
.link{font-size:11.5px;color:var(--ink-3);word-break:break-all;background:var(--bg);
  border-radius:8px;padding:8px 10px;margin-top:7px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.55}

.msg{background:var(--card);border-radius:12px;padding:18px;font-size:14px;line-height:1.8;
  box-shadow:var(--shadow)}
.msg.error{background:var(--stop-soft);color:var(--stop);box-shadow:none}
.msg b{display:block;margin-bottom:4px}
.msg code{background:rgba(127,127,127,.16);padding:1px 5px;border-radius:4px;font-size:12.5px}
.empty{text-align:center;color:var(--ink-3);font-size:13.5px;padding:24px 10px}
.hint{font-size:12.5px;color:var(--ink-3);margin:7px 2px 0;line-height:1.75}
.warn{background:var(--stop-soft);color:var(--stop);border-radius:9px;padding:11px 12px;
  font-size:12.5px;line-height:1.75;margin-top:10px}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,14px);background:var(--ink);
  color:var(--bg);font-size:13.5px;font-weight:700;padding:11px 20px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:20;
  max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--stop);color:#fff}

@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>

<div class="wrap">
  <div id="app" aria-live="polite"><p class="empty">読み込んでいます…</p></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="./config.local.js" onerror="window.__noConfig=true"></script>
<script src="./js/db.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');

  let admin = null;
  let data = null;
  let tab = 'events';
  let openEvent = null;
  let busy = false;

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const DOW = ['日','月','火','水','木','金','土'];
  function fmtDate(iso) {
    const [y, m, d] = String(iso).split('-').map(Number);
    const dow = new Date(y, m - 1, d).getDay();
    return { text: m + '/' + d, dow: DOW[dow], cls: dow === 0 ? 'sun' : dow === 6 ? 'sat' : '' };
  }
  const fmtTime = (t) => (t ? String(t).slice(0, 5) : '');
  const todayISO = () => {
    const n = new Date();
    return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' +
           String(n.getDate()).padStart(2, '0');
  };

  let toastTimer = null;
  function toast(text, bad) {
    toastEl.textContent = text;
    toastEl.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = 'toast'; }, bad ? 4500 : 1700);
  }

  // 個人リンクの土台。公開先が決まったら「リンク配布」タブで設定する。
  const BASE_KEY = 'day07.linkBase';
  function linkBase() {
    return localStorage.getItem(BASE_KEY) ||
           location.href.replace(/admin\.html.*$/, '').replace(/[?#].*$/, '');
  }
  // LINE の内蔵ブラウザは Google 認証を弾く（403: disallowed_useragent）。
  // openExternalBrowser=1 を付けると、端末の既定ブラウザで開いてくれる。
  const memberLink = (token) =>
    linkBase().replace(/\/?$/, '/') + '?openExternalBrowser=1#' + token;

  async function call(fn, args) {
    if (busy) return null;
    busy = true;
    document.querySelectorAll('button').forEach((b) => { b.disabled = true; });
    try {
      data = await DB.rpc(fn, Object.assign({ p_admin: admin }, args || {}));
      render();
      return data;
    } catch (e) {
      toast(e.message, true);
      document.querySelectorAll('button').forEach((b) => { b.disabled = false; });
      return null;
    } finally {
      busy = false;
    }
  }

  // ================= 予定タブ =================
  function eventsTab() {
    let h = '';

    h += '<div class="sect">予定を追加</div>';
    h += '<div class="card"><div class="pad"><div class="grid">';
    h += '<div class="grid two">';
    h += '<div><label class="f" for="f-date">日付</label><input type="date" id="f-date" value="' + todayISO() + '"></div>';
    h += '<div><label class="f" for="f-time">開始時刻</label><input type="time" id="f-time"></div>';
    h += '</div>';
    h += '<div class="grid two">';
    h += '<div><label class="f" for="f-kind">種別</label><select id="f-kind">' +
         '<option value="practice">練習</option><option value="match">試合</option></select></div>';
    h += '<div><label class="f" for="f-place">場所</label><input id="f-place" placeholder="河川敷グラウンド"></div>';
    h += '</div>';
    h += '<div><label class="f" for="f-note">メモ</label><input id="f-note" placeholder="対戦相手・持ち物など"></div>';
    h += '<label class="chk"><input type="checkbox" id="f-car" checked>車を出せるかも聞く</label>';
    h += '<div><button class="btn" data-act="add-event">この予定を追加</button></div>';
    h += '</div></div></div>';

    const events = data.events || [];
    h += '<div class="sect">予定と出欠</div>';
    if (!events.length) {
      h += '<p class="empty">まだ予定がありません。</p>';
      return h;
    }

    const actives = (data.members || []).filter((m) => m.active);
    for (const ev of events) {
      const d = fmtDate(ev.date);
      const yes = ev.yes_count || 0, no = ev.no_count || 0;
      const answers = ev.answers || {};
      const noReply = actives.filter((m) => !answers[m.id]);

      h += '<div class="card kind-' + ev.kind + '">';
      h += '<div class="band">';
      h += '<span class="d-num">' + d.text + '</span>';
      h += '<span class="d-dow ' + d.cls + '">(' + d.dow + ')</span>';
      h += '<span class="badge ' + ev.kind + '">' + (ev.kind === 'match' ? '試合' : '練習') + '</span>';
      h += '</div>';

      h += '<div class="pad">';
      if (ev.start_time || ev.place || ev.note) {
        h += '<p class="meta">';
        if (ev.start_time) h += '<span class="t">' + esc(fmtTime(ev.start_time)) + '</span>';
        h += esc([ev.place, ev.note].filter(Boolean).join('　/　'));
        h += '</p>';
      }

      h += '<div class="tally">';
      h += '<span class="yes">出席 <b>' + yes + '</b></span>';
      h += '<span class="no">欠席 <b>' + no + '</b></span>';
      h += '<span>未回答 <b>' + noReply.length + '</b></span>';
      if (ev.asks_car) h += '<span>車 <b>' + (ev.car_count || 0) + '</b></span>';
      h += '</div>';

      if (noReply.length) {
        h += '<div class="nore"><b>未回答（' + noReply.length + '人）:</b> ' +
             noReply.map((m) => esc(m.name)).join('、') + '</div>';
      }

      h += '<div class="row" style="margin-top:12px">';
      h += '<button class="btn ghost sm" data-act="proxy" data-ev="' + ev.id + '">' +
           (openEvent === ev.id ? '閉じる' : '代理入力・修正') + '</button>';
      h += '<button class="btn danger sm" data-act="del-event" data-ev="' + ev.id + '">削除</button>';
      h += '</div>';

      if (openEvent === ev.id) {
        h += '<div class="proxy">';
        for (const m of actives) {
          const st = answers[m.id] || null;
          h += '<div class="prow"><span class="pname">' +
               (m.number ? '<i>' + esc(m.number) + '</i>' : '') + esc(m.name) + '</span>';
          h += '<span class="pset">';
          h += '<button class="yes" aria-pressed="' + (st === 'yes') + '" data-act="pset" data-ev="' +
               ev.id + '" data-m="' + m.id + '" data-v="yes">出席</button>';
          h += '<button class="no" aria-pressed="' + (st === 'no') + '" data-act="pset" data-ev="' +
               ev.id + '" data-m="' + m.id + '" data-v="no">欠席</button>';
          if (ev.asks_car) {
            const car = (ev.cars || {})[m.id] || null;
            h += '<button class="car" aria-pressed="' + (car === 'yes') + '"' +
                 (st === 'yes' ? '' : ' disabled') +
                 ' data-act="pcar" data-ev="' + ev.id + '" data-m="' + m.id + '">車</button>';
          }
          h += '</span></div>';
        }
        h += '<p class="hint">同じボタンをもう一度押すと未回答に戻ります。</p>';
        h += '</div>';
      }

      h += '</div></div>';
    }
    return h;
  }

  // ================= メンバータブ =================
  function membersTab() {
    let h = '';
    h += '<div class="sect">名簿をまとめて登録</div>';
    h += '<div class="card"><div class="pad">';
    h += '<label class="f" for="f-bulk">名前とメールを1行に1人ずつ（スプレッドシートの2列をそのまま貼れます）</label>';
    h += '<textarea id="f-bulk" rows="6" placeholder="長井 孝資&#9;nagai@example.com&#10;志賀 祐&#9;shiga@example.com&#10;妹尾 英人"></textarea>';
    h += '<p class="hint"><b>名前だけでも登録できます。</b>メールを入れておくと、その人は' +
         '<b>ログインするだけ</b>で自分の画面が開きます（合言葉も招待リンクも要りません）。<br>' +
         'すでにいる名前は飛ばし、メールだけ書き足します。タブ区切り・カンマ区切りのどちらでも読めます。</p>';
    h += '<div style="margin-top:12px"><button class="btn" data-act="add-members">まとめて登録</button></div>';
    h += '</div></div>';

    const members = data.members || [];
    const linked = members.filter((m) => m.active && m.linked).length;
    const activeN = members.filter((m) => m.active).length;

    h += '<div class="sect">メンバー（' + activeN + '人・ログイン済み ' + linked + '人）</div>';
    if (!members.length) {
      h += '<p class="empty">まだ登録されていません。</p>';
      return h;
    }

    h += '<div class="card"><div class="pad">';
    for (const m of members) {
      h += '<div class="mrow' + (m.active ? '' : ' off') + '">';
      h += '<input class="no" value="' + esc(m.number || '') + '" placeholder="番号" data-fld="number" data-m="' + m.id + '">';
      h += '<input class="nm" value="' + esc(m.name) + '" data-fld="name" data-m="' + m.id + '">';
      h += '<span class="tag ' + (m.linked ? 'on' : 'off') + '">' +
           (m.linked ? 'ログイン済み' : '未ログイン') + '</span>';
      h += '<button class="btn ghost sm" data-act="save-member" data-m="' + m.id + '">保存</button>';
      h += '<input class="em" value="' + esc(m.email || '') + '" placeholder="メールアドレス（任意）"' +
           ' data-fld="email" data-m="' + m.id + '">';
      h += '<button class="btn ghost sm" data-act="toggle-member" data-m="' + m.id + '" data-v="' +
           (m.active ? 'off' : 'on') + '">' + (m.active ? '休会' : '復帰') + '</button>';
      h += '</div>';
    }
    h += '</div></div>';
    h += '<p class="hint">休会にすると出欠の集計から外れます。過去の記録は残ります。<br>' +
         '<b>メールを入れた人</b>は、ログインするだけで自分の画面が開きます。' +
         '入っていない人は、合言葉で名簿から自分を選ぶことになります。</p>';
    return h;
  }

  // ================= リンクタブ =================
  function linksTab() {
    let h = '';
    h += '<div class="sect">公開先のURL</div>';
    h += '<div class="card"><div class="pad">';
    h += '<label class="f" for="f-base">インターネット上の住所</label>';
    h += '<input id="f-base" value="' + esc(linkBase()) + '" placeholder="https://example.com/">';
    h += '<p class="hint">公開したら、その住所をここに入れてください。下の招待リンクがその住所で作られます。' +
         '（この設定はこの端末にだけ残ります）</p>';
    h += '<div style="margin-top:12px"><button class="btn ghost" data-act="save-base">保存</button></div>';
    h += '</div></div>';

    const actives = (data.members || []).filter((m) => m.active);
    const yet = actives.filter((m) => !m.linked);
    const noMail = yet.filter((m) => !m.email);

    h += '<div class="sect">チームに配るもの</div>';
    h += '<div class="card"><div class="pad">';
    h += '<div class="codebox"><p class="hint" style="margin:0;text-align:center">合言葉</p>';
    h += '<p class="code">' + esc(data.join_code || '------') + '</p></div>';
    h += '<p class="hint">LINEに貼るのは<b>この合言葉と、上のURLだけ</b>です。人ごとに違うリンクを' +
         '配る必要はありません。<br>' +
         '名簿に<b>メールを登録した人</b>は、合言葉すら要らずログインだけで入れます' +
         '（いま ' + (actives.length - noMail.length) + ' / ' + actives.length + ' 人）。</p>';
    h += '<div class="row" style="margin-top:12px">';
    h += '<button class="btn" data-act="copy-invite">LINE用の文面をコピー</button>';
    h += '<button class="btn danger sm" data-act="reissue-code">合言葉を作り直す</button>';
    h += '</div></div></div>';

    h += '<div class="sect">個別の招待リンク（' + actives.length + '人・予備）</div>';
    h += '<p class="hint" style="margin:0 2px 8px">' +
         '合言葉がうまく伝わらない人にだけ、個別に渡してください。1回使うと無効になります。</p>';
    if (!actives.length) {
      h += '<p class="empty">メンバーを登録するとここにリンクが出ます。</p>';
    } else {
      for (const m of actives) {
        h += '<div class="card"><div class="pad">';
        h += '<div class="row"><b style="flex:1">' + esc(m.name) + '</b>';
        h += '<span class="tag ' + (m.linked ? 'on' : 'off') + '">' +
             (m.linked ? 'ログイン済み' : '未ログイン') + '</span>';
        h += '<button class="btn ghost sm" data-act="copy-one" data-t="' + esc(m.token) + '">コピー</button>';
        h += '<button class="btn danger sm" data-act="reissue" data-m="' + m.id + '">作り直す</button></div>';
        h += '<div class="link">' + esc(memberLink(m.token)) + '</div>';
        h += '</div></div>';
      }
      h += '<p class="hint">リンクが外に漏れたときは「作り直す」を押してください。' +
           '古いリンクはその場で使えなくなります。</p>';
    }

    h += '<div class="sect">管理リンク</div>';
    h += '<div class="card"><div class="pad">';
    h += '<p class="hint" style="margin-top:0">いまあなたが開いているこのページのURLが、管理リンクです。' +
         '人に見せないでください。</p>';
    h += '<div class="warn">誰かに見られたかもしれないときは、下のボタンで作り直してください。' +
         '<b>古い管理リンクはその場で使えなくなります。</b>新しいURLはこのページのアドレス欄に入るので、' +
         'ブックマークを取り直してください。</div>';
    h += '<div style="margin-top:12px"><button class="btn danger" data-act="reissue-admin">管理リンクを作り直す</button></div>';
    h += '</div></div>';
    return h;
  }

  function render() {
    let h = '';
    h += '<div class="head"><h1 class="title">' + esc(data.team) + '<span>管理</span></h1>';
    h += '<button class="btn ghost sm" data-act="rename">名前変更</button></div>';

    h += '<div class="tabs" role="tablist">';
    for (const [key, label] of [['events','予定'],['members','メンバー'],['links','リンク配布']]) {
      h += '<button role="tab" aria-selected="' + (tab === key) + '" data-act="tab" data-t="' + key + '">' +
           label + '</button>';
    }
    h += '</div>';

    h += tab === 'events' ? eventsTab() : tab === 'members' ? membersTab() : linksTab();
    app.innerHTML = h;
  }

  async function copyText(text, okMsg) {
    try {
      await navigator.clipboard.writeText(text);
      toast(okMsg);
    } catch (e) {
      // クリップボードが使えない環境（古いブラウザ・http以外）向けの逃げ道
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      toast(ok ? okMsg : 'コピーできませんでした。長押しで選んでください。', !ok);
    }
  }

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;

    if (act === 'tab') { tab = btn.dataset.t; openEvent = null; render(); return; }

    if (act === 'add-event') {
      const date = document.getElementById('f-date').value;
      if (!date) { toast('日付を選んでください', true); return; }
      await call('admin_save_event', {
        p_event_id: null,
        p_date: date,
        p_time: document.getElementById('f-time').value || null,
        p_kind: document.getElementById('f-kind').value,
        p_place: document.getElementById('f-place').value,
        p_note: document.getElementById('f-note').value,
        p_asks_car: document.getElementById('f-car').checked,
      });
      toast('予定を追加しました');
      return;
    }

    if (act === 'del-event') {
      if (!confirm('この予定を削除します。出欠の回答も一緒に消えます。よろしいですか？')) return;
      await call('admin_delete_event', { p_event_id: btn.dataset.ev });
      toast('削除しました');
      return;
    }

    if (act === 'proxy') {
      openEvent = openEvent === btn.dataset.ev ? null : btn.dataset.ev;
      render();
      return;
    }

    if (act === 'pset') {
      const ev = (data.events || []).find((x) => x.id === btn.dataset.ev);
      const now = ev && ev.answers ? ev.answers[btn.dataset.m] : null;
      const next = now === btn.dataset.v ? null : btn.dataset.v;
      // 欠席・未回答にしたら車の回答も落とす
      const car = next === 'yes' ? ((ev && ev.cars) || {})[btn.dataset.m] || null : null;
      await call('admin_set_status', {
        p_event_id: btn.dataset.ev, p_member_id: btn.dataset.m, p_status: next, p_car: car,
      });
      return;
    }

    if (act === 'pcar') {
      const ev = (data.events || []).find((x) => x.id === btn.dataset.ev);
      const now = ((ev && ev.cars) || {})[btn.dataset.m] || null;
      await call('admin_set_status', {
        p_event_id: btn.dataset.ev, p_member_id: btn.dataset.m, p_status: 'yes',
        p_car: now === 'yes' ? null : 'yes',
      });
      return;
    }

    if (act === 'add-members') {
      const box = document.getElementById('f-bulk');
      const rows = box.value.split('\n').map((s) => s.trim()).filter(Boolean);
      if (!rows.length) { toast('名前を入力してください', true); return; }
      const res = await call('admin_import_members', { p_rows: rows });
      if (res) {
        toast(res.added + '人を登録' +
              (Number(res.updated) ? '、' + res.updated + '人にメールを追加' : ''));
      }
      return;
    }

    if (act === 'save-member') {
      const id = btn.dataset.m;
      const get = (f) => document.querySelector('input[data-fld="' + f + '"][data-m="' + id + '"]').value;
      if (busy) return;
      busy = true;
      document.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      try {
        // 名前・背番号とメールは窓口が別なので、続けて2回呼ぶ
        await DB.rpc('admin_update_member', {
          p_admin: admin, p_member_id: id,
          p_name: get('name'), p_number: get('number'), p_active: null,
        });
        data = await DB.rpc('admin_set_member_email', {
          p_admin: admin, p_member_id: id, p_email: get('email'),
        });
        render();
        toast('保存しました');
      } catch (err) {
        toast(err.message, true);
        document.querySelectorAll('button').forEach((b) => { b.disabled = false; });
      } finally {
        busy = false;
      }
      return;
    }

    if (act === 'toggle-member') {
      await call('admin_update_member', {
        p_member_id: btn.dataset.m, p_name: null, p_number: null,
        p_active: btn.dataset.v === 'on',
      });
      return;
    }

    if (act === 'reissue') {
      if (!confirm('この人の招待リンクを作り直します。今までのリンクは使えなくなります。よろしいですか？')) return;
      await call('admin_reissue_token', { p_member_id: btn.dataset.m });
      toast('作り直しました。新しいリンクを渡してください');
      return;
    }

    // 管理リンクそのものの作り直し。返ってくる新トークンで、開いているURLも差し替える。
    if (act === 'reissue-admin') {
      if (!confirm('管理リンクを作り直します。\n\n今のURLは使えなくなります。\n新しいURLはこのページのアドレス欄に入ります。よろしいですか？')) return;
      try {
        const res = await DB.rpc('admin_reissue_admin_token', { p_admin: admin });
        admin = res.admin_token;
        history.replaceState(null, '', location.pathname + '#' + admin);
        data = await DB.rpc('admin_home', { p_admin: admin });
        render();
        toast('作り直しました。いまのURLをブックマークし直してください');
      } catch (err) {
        toast(err.message, true);
      }
      return;
    }

    if (act === 'rename') {
      const name = prompt('チーム名', data.team);
      if (name === null) return;
      await call('admin_rename_team', { p_name: name });
      return;
    }

    if (act === 'save-base') {
      const v = document.getElementById('f-base').value.trim();
      if (v) localStorage.setItem(BASE_KEY, v); else localStorage.removeItem(BASE_KEY);
      render();
      toast('保存しました');
      return;
    }

    if (act === 'copy-one') {
      copyText(memberLink(btn.dataset.t), 'リンクをコピーしました');
      return;
    }

    if (act === 'copy-invite') {
      const base = linkBase().replace(/\/?$/, '/');
      const body = [
        '【' + (data.team || 'チーム') + '　出欠アプリのご案内】',
        '',
        'これまでのスプレッドシートの代わりに、出欠をここで登録できるようにしました。',
        '',
        '▼ ここを開いてください',
        base + '?openExternalBrowser=1',
        '',
        '「Googleでログイン」を押してください。',
        'そのあと合言葉を聞かれたら、これを入れて自分の名前を選んでください。',
        '',
        '合言葉：' + (data.join_code || ''),
        '',
        '※次からはURLを開くだけで自分の欄が出ます。',
        '※出席のときは「車を出せるか」も聞かれます。',
      ].join('\n');
      copyText(body, 'LINE用の文面をコピーしました');
      return;
    }

    if (act === 'reissue-code') {
      if (!confirm('合言葉を作り直します。\n\n古い合言葉は使えなくなります。\n' +
                   'まだ登録していない人には、新しい合言葉を配り直してください。よろしいですか？')) return;
      await call('admin_reissue_join_code');
      toast('作り直しました');
      return;
    }
  });

  async function start() {
    if (window.__noConfig || !DB.ready()) {
      app.innerHTML = '<div class="msg"><b>まだ接続先が設定されていません。</b>' +
        '<code>cp .env.example .env</code> で .env を作り、Supabase の Project URL と anon キーを書いてから ' +
        '<code>npm run setup</code> を実行してください。</div>';
      return;
    }
    admin = (location.hash || '').replace(/^#\/?a?\/?/, '').trim();
    if (!admin) {
      app.innerHTML = '<div class="msg"><b>管理用トークンが必要です。</b>' +
        'Supabase で <code>db/schema.sql</code> を実行したときに表示された文字列を、' +
        'このページのURLの末尾に <code>#</code> を付けて貼ってください。</div>';
      return;
    }
    try {
      data = await DB.rpc('admin_home', { p_admin: admin });
      render();
    } catch (e) {
      app.innerHTML = '<div class="msg error"><b>開けませんでした。</b>' + esc(e.message) + '</div>';
    }
  }

  window.addEventListener('hashchange', () => location.reload());
  start();
})();
</script>
</body>
</html>
